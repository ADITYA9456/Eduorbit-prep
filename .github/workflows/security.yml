name: Security checks

# No repository secrets are used, so this is safe for pull requests from forks.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Dependency audit (fails on high or critical in production dependencies)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
